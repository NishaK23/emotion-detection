<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection AI</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 28px;
            border-radius: 14px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        }
        h2 { margin-top: 0; color: #38bdf8; }
        textarea {
            width: 100%;
            height: 95px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
        }
        button {
            margin-top: 14px;
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #7dd3fc; }
        .result {
            margin-top: 20px;
            padding: 16px;
            background: #0f172a;
            border-radius: 10px;
            display: none;
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .emotion-title {
            font-size: 24px;
            font-weight: bold;
            color: #4ade80;
            text-transform: uppercase;
        }
        .status-pill {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 999px;
            font-weight: 600;
        }
        .confident { background: #14532d; color: #86efac; }
        .uncertain { background: #78350f; color: #fde68a; }
        .bar-row { margin-top: 10px; font-size: 14px; }
        .bar-bg { background: #334155; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .bar-fill { background: #38bdf8; height: 100%; transition: width 0.3s ease; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Emotion Detection AI</h2>
        <p style="color: #94a3b8; font-size: 14px;">Analyze text across 6 emotions using BiLSTM.</p>
        <textarea id="textInput" placeholder="Example: I'm feeling Bad!!.."></textarea>
        <button onclick="predictEmotion()">Analyze Emotion</button>

        <div class="result" id="resultBox">
            <div class="header-row">
                <div class="emotion-title" id="emotionText"></div>
                <span class="status-pill" id="confidenceBadge"></span>
            </div>
            <div style="color: #94a3b8; font-size: 14px; margin-top: 4px;" id="confidenceText"></div>
            <div id="barsContainer" style="margin-top: 14px;"></div>
        </div>
    </div>

    <script>
        async function predictEmotion() {
            const text = document.getElementById("textInput").value.trim();
            if (!text) return alert("Please enter a sentence first.");

            const res = await fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text })
            });

            const data = await res.json();
            if (!res.ok) return alert(data.detail || "Something went wrong.");

            document.getElementById("resultBox").style.display = "block";
            document.getElementById("emotionText").innerText = `${data.emoji} ${data.predicted_emotion}`;

            const pct = (data.confidence * 100).toFixed(1);
            document.getElementById("confidenceText").innerText = `Confidence Score: ${pct}%`;

            const badge = document.getElementById("confidenceBadge");
            if (data.is_confident) {
                badge.innerText = "High Confidence";
                badge.className = "status-pill confident";
            } else {
                badge.innerText = "Low Confidence";
                badge.className = "status-pill uncertain";
            }

            const bars = document.getElementById("barsContainer");
            bars.innerHTML = "";
            for (const [emotion, prob] of Object.entries(data.all_probabilities)) {
                const scorePct = (prob * 100).toFixed(1);
                bars.innerHTML += `
                    <div class="bar-row">
                        <div style="display:flex; justify-content:space-between;">
                            <span style="text-transform:capitalize;">${emotion}</span>
                            <span>${scorePct}%</span>
                        </div>
                        <div class="bar-bg"><div class="bar-fill" style="width:${scorePct}%"></div></div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
